spring:
  application:
    name: ask-my-notes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/asknotes}
    username: ${DB_USER:asknotes}
    password: ${DB_PASSWORD:asknotes}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  chat-model: llama3.2:3b
  embedding-model: nomic-embed-text
  embedding-dimensions: 768
  connect-timeout: 2s
  read-timeout: 90

notes:
  directory: ${NOTES_DIRECTORY:./notes}
  chunk-max-chars: 1500